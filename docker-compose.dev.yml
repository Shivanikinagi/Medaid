version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:6.0
    container_name: medaid-mongodb-dev
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data_dev:/data/db
    ports:
      - "27017:27017"

  # Python service for AI/ML processing
  python-service:
    build:
      context: ./backend/python_service
    container_name: medaid-python-service-dev
    restart: always
    ports:
      - "5001:5001"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./backend/python_service:/app

  # Backend service with hot reloading
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: medaid-backend-dev
    restart: always
    environment:
      - NODE_ENV=development
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=5008
      - PYTHON_SERVICE_URL=http://python-service:5001
    ports:
      - "5008:5008"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - /app/node_modules
    depends_on:
      - mongodb
      - python-service

  # Frontend service with hot reloading
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: medaid-frontend-dev
    restart: always
    ports:
      - "5175:5175"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongodb_data_dev: