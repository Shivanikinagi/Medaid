version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:6.0
    container_name: medaid-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  # Python service for AI/ML processing
  python-service:
    build:
      context: ./backend/python_service
    container_name: medaid-python-service
    restart: always
    ports:
      - "5001:5001"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medaid-backend
    restart: always
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=5008
      - PYTHON_SERVICE_URL=http://python-service:5001
    ports:
      - "5008:5008"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
      - python-service

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medaid-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data: