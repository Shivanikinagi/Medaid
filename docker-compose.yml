version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:6.0
    container_name: medaid-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medaid-backend
    restart: always
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://admin:password@mongodb:27017/medaid?authSource=admin
      - JWT_SECRET=your_jwt_secret_key_here
      - GOOGLE_API_KEY=your_google_gemini_api_key_here
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/python_service:/app/python_service
    depends_on:
      - mongodb

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medaid-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data: